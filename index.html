<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>💐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="flowers" class="flowers" aria-hidden="true"></div>
  <aside id="rail" class="rail" aria-label="Flowers">
    <button class="chip" type="button" data-file="bouquet-rose-red.png" aria-label="Red rose"><img alt="" draggable="false"></button>
    <button class="chip" type="button" data-file="bouquet-peony-red.png" aria-label="Red peony"><img alt="" draggable="false"></button>
    <button class="chip" type="button" data-file="bouquet-peony-pink.png" aria-label="Pink peony"><img alt="" draggable="false"></button>
    <button class="chip" type="button" data-file="bouquet-anemone-mint.png" aria-label="Mint anemone"><img alt="" draggable="false"></button>
    <button class="chip" type="button" data-file="bouquet-daisy-cream.png" aria-label="Cream daisy"><img alt="" draggable="false"></button>
  </aside>
  <img id="wrap" class="wrap" alt="" draggable="false">
  <button id="clear" class="clear" type="button" aria-label="Clear the bouquet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
  </button>
  <script src="script.js"></script>
</body>
</html>
